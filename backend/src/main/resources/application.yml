spring:
  application:
    name: chaoslab-backend
  datasource:
    url: ${CHAOSLAB_DB_URL}
    username: ${CHAOSLAB_DB_USERNAME}
    password: ${CHAOSLAB_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

chaoslab:
  execution:
    recovery-scan-interval-ms: 1000