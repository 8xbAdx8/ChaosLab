name: chaoslab-demo

services:
  inventory-service:
    build:
      context: ..
      dockerfile: demo-services/Dockerfile
      args:
        SERVICE: inventory-service
    environment:
      SERVER_PORT: 8080
    labels:
      com.chaoslab.role: demo-target
      com.chaoslab.environment: CHAOS_LAB
      com.chaoslab.service: inventory-service
    networks:
      - chaoslab-demo-net
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "2", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 100

  order-service:
    build:
      context: ..
      dockerfile: demo-services/Dockerfile
      args:
        SERVICE: order-service
    depends_on:
      inventory-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      INVENTORY_BASE_URL: http://inventory-service:8080
    labels:
      com.chaoslab.role: demo-target
      com.chaoslab.environment: CHAOS_LAB
      com.chaoslab.service: order-service
    networks:
      - chaoslab-demo-net
    ports:
      - "127.0.0.1:18081:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "2", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 100

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles:
      - observability
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    networks:
      - chaoslab-demo-net
      - chaoslab-observability-net
    ports:
      - "127.0.0.1:19090:9090"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100

  grafana:
    image: grafana/grafana-oss:13.0.2
    profiles:
      - observability
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - chaoslab-observability-net
    ports:
      - "127.0.0.1:13000:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/grafana
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100

networks:
  chaoslab-demo-net:
    driver: bridge
  chaoslab-observability-net:
    driver: bridge

volumes:
  prometheus-data:
