name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties
      - name: Test backend
        working-directory: backend
        run: bash ./mvnw --batch-mode verify
      - name: Test demo services
        run: bash ./backend/mvnw -f demo-services/pom.xml --batch-mode verify
